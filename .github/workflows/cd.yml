# Solv CD: deploys run from a tag, never from a merge, and the production
# environment forces a human approval first. Provider credentials travel
# only from Actions Secrets into the running service's environment (Render
# reads them from its own dashboard config) and never touch the repository.
#
# Host: Render free web service, Docker runtime, built from the committed
# Dockerfile (docs/WORKFLOW.md §4.3, changed 2026-11-15: fly.io was
# replaced at the owner's direction — the account was flagged high-risk at
# creation and could not host an app).
name: cd

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    environment: production        # requires a reviewer to approve
    steps:
      - uses: actions/checkout@v4
      - name: Trigger the Render deploy hook
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}'
      - name: Verify the deployment answers
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "https://${{ vars.RENDER_SERVICE_HOST }}/healthz"; then exit 0; fi
            sleep 10
          done
          exit 1
