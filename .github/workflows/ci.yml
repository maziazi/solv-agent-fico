name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  commit-lint:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR title and commit subjects
        run: |
          if [ -n "${{ github.event.pull_request.title }}" ]; then
            bash tools/check_commit_msg.sh "${{ github.event.pull_request.title }}"
          fi
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -n "$base" ] && [ -n "$head" ]; then
            git log --format=%s "$base..$head" | while read -r subject; do
              bash tools/check_commit_msg.sh "$subject"
            done
          fi

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run tests with no network credentials present
        run: cargo test --all-features --locked

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  forbidden-files:
    name: forbidden files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed state and env files
        run: |
          if git ls-files --error-unmatch .env solv_state.json 2>/dev/null; then
            echo "::error::.env or solv_state.json is tracked; see AGENTS.md"
            exit 1
          fi
          exit 0

  smoke:
    name: healthz smoke
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - name: Boot and probe /healthz
        run: |
          ./target/release/solv &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz; then ok=1; break; fi
            sleep 1
          done
          kill $pid
          test "$ok" = "1"
        env:
          PORT: 8080
          STATE_FILE: ci_state.json

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release image (no push)
        run: docker build -t solv-ci:${{ github.sha }} .
