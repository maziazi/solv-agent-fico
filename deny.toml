# cargo-deny configuration used by the CI `audit` job (docs/WORKFLOW.md §4.1).
#
# The dependency tree is expected to stay permissive-licensed; anything outside
# this list fails the build rather than slipping in.

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
