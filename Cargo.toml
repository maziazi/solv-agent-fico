[package]
name = "solv"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A pre-spend gate and credit bureau for AI agents"
license-file = "LICENSE"
publish = false

[dependencies]
async-trait = "0.1"
axum = "0.8"
dashmap = "6"
dotenvy = "0.15"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: default float parsing can be 1 ULP off, which would
# break an evidence hash after a snapshot reload (tests/receipt.rs).
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
